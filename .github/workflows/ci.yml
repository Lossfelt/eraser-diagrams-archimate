name: Check library

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run icons:check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Configure renderer browser
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { chromium } from 'playwright';
          appendFileSync(process.env.GITHUB_ENV, `CHROME_PATH=${chromium.executablePath()}\n`);
          JS
      - run: npm run render
      - run: npm run gallery
      - name: Check npm package
        run: npm pack --dry-run
      - name: Save rendered examples
        uses: actions/upload-artifact@v6
        with:
          name: rendered-examples
          path: |
            output/*.png
            output/*.html
            output/*.json
          if-no-files-found: error
          retention-days: 14

  # Fletter Dependabot-PR-er automatisk når CI er grønn, men bare minor- og
  # patch-oppdateringer. Major-hopp (også sikkerhetsoppdateringer som er
  # major) blir liggende for manuell testing, i tråd med dependabot.yml.
  # Flettes direkte i stedet for med "gh pr merge --auto", slik at det ikke
  # krever branch protection eller "Allow auto-merge" i repoet.
  dependabot-fletting:
    needs: test-and-render
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v2
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge "$PR_URL" --squash --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
