name: Check library

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run icons:check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Configure renderer browser
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { chromium } from 'playwright';
          appendFileSync(process.env.GITHUB_ENV, `CHROME_PATH=${chromium.executablePath()}\n`);
          JS
      - run: npm run render
      - run: npm run gallery
      - name: Check npm package
        run: npm pack --dry-run
      - name: Save rendered examples
        uses: actions/upload-artifact@v4
        with:
          name: rendered-examples
          path: |
            output/*.png
            output/*.html
            output/*.json
          if-no-files-found: error
          retention-days: 14
